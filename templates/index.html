<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务系统成绩推送服务</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .container { max-width: 800px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #output { background-color: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; min-height: 100px; max-height: 500px; overflow-y: auto; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部按钮栏：右对齐，移动端不遮挡，桌面端跟随容器 -->
        <div class="d-flex justify-content-end mb-2 pt-2 gap-2">
            <a href="/query" class="btn btn-sm btn-outline-info">
                🔍 查询任务状态
            </a>
            <a href="https://r08n4wcf67e.feishu.cn/wiki/V5VfwG44sivjjbkJkkBcHzlbnEe" target="_blank" class="btn btn-sm btn-outline-primary">
                📖 详细使用说明
            </a>
        </div>
        <div class="text-center mb-4">
            <h2>🎓 教务系统成绩查询与推送</h2>
            <p class="text-muted">设置自动定时查询，成绩更新第一时间通知</p>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="runForm">
                    <div class="mb-3">
                        <label for="url" class="form-label">教务系统网址 (部分学校需要去除后缀jwglxt/)</label>
                        <input type="text" class="form-control" id="url" value="http://syjw.zjhu.edu.cn/jwglxt/" required>
                        <div class="form-text">湖师学子默认即可</div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">学号 (Username)</label>
                            <input type="text" class="form-control" id="username" placeholder="请输入学号" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">密码 (Password)</label>
                            <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                            <div class="form-text">为教务系统密码，非统一认证系统密码</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="token" class="form-label">
                            <a href="https://push.showdoc.com.cn/#/push" target="_blank" style="text-decoration: underline; color: #0d6efd; font-weight: bold;">ShowDoc Token (推送凭证，点我获取) 🔗</a> 
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="token" placeholder="必填，用于接收成绩推送" required>
                        <div class="form-text">微信推送专属地址，为扫码关注后公众号回复的第一个链接</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="form-check mt-2">
                                <input type="checkbox" class="form-check-input" id="forcePush">
                                <label class="form-check-label" for="forcePush">强制推送 (即使成绩无变化也推送)</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="cronExpression" class="form-label">定时推送频率</label>
                            <select class="form-select" id="cronExpression">
                                <option value="*/1 * * * *">每 1 分钟检测一次 </option>
                                <option value="*/30 * * * *">每 30 分钟检测一次</option>
                                <option value="0 * * * *">每 60 分钟检测一次</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" class="btn btn-secondary me-md-2" id="testBtn">
                            <span class="spinner-border spinner-border-sm loading" role="status" aria-hidden="true"></span>
                            <span class="btn-text">立即测试一次</span>
                        </button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">
                            <span class="spinner-border spinner-border-sm loading" role="status" aria-hidden="true"></span>
                            <span class="btn-text">保存并开启定时推送</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                运行结果 / 状态日志
            </div>
            <div class="card-body">
                <div id="output">等待操作...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const getFormData = () => ({
            url: document.getElementById('url').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            token: document.getElementById('token').value,
            force_push: document.getElementById('forcePush').checked,
            cron_expression: document.getElementById('cronExpression').value
        });

        const setLoading = (btn, isLoading, text) => {
            const loading = btn.querySelector('.loading');
            const btnText = btn.querySelector('.btn-text');
            btn.disabled = isLoading;
            loading.style.display = isLoading ? 'inline-block' : 'none';
            btnText.textContent = text;
        };

        // 立即测试
        document.getElementById('testBtn').addEventListener('click', async function() {
            const btn = this;
            const output = document.getElementById('output');
            const data = getFormData();

            if (!data.username || !data.password || !data.token) {
                alert('请填写完整信息（学号、密码、Token）');
                return;
            }

            if (data.token.length !== 108) {
                alert('输入错误，未复制完整地址，请再次检查');
                return;
            }

            setLoading(btn, true, '运行中...');
            output.textContent = '正在连接教务系统，请稍候...';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    output.textContent = result.output || '运行成功，但没有输出内容。';
                } else {
                    output.textContent = `❌ 运行出错:\n${result.error || result.message || '未知错误'}\n\nstdout:\n${result.output || ''}`;
                }
            } catch (error) {
                output.textContent = `❌ 网络请求失败: ${error.message}`;
            } finally {
                setLoading(btn, false, '立即测试一次');
            }
        });

        // 保存定时任务
        document.getElementById('runForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const output = document.getElementById('output');
            const data = getFormData();

            if (data.token.length !== 108) {
                alert('输入错误，未复制完整地址，请再次检查');
                return;
            }

            setLoading(btn, true, '正在校验并保存...');
            
            try {
                const response = await fetch('/save_task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('✅ 验证通过！设置成功！系统将按照您设定的频率自动查询并推送。');
                    output.textContent = '验证通过。任务已保存。系统将自动在后台运行。';
                } else {
                    alert(`❌ 保存失败: ${result.message}`);
                    let errorMsg = `❌ 保存失败: ${result.message}`;
                    if (result.details) {
                        errorMsg += `\n\n🔍 详细错误信息:\n${result.details}`;
                    }
                    output.textContent = errorMsg;
                }
            } catch (error) {
                alert(`❌ 网络错误: ${error.message}`);
            } finally {
                setLoading(btn, false, '保存并开启定时推送');
            }
        });
    </script>
</body>
</html>
