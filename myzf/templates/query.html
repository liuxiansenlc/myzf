<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>任务状态查询 - 教务系统成绩推送</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .container { max-width: 800px; margin-top: 50px; }
      .status-card { display: none; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="container">
        <!-- 顶部按钮栏 -->
        <div class="d-flex justify-content-between mb-4 align-items-center">
            <a href="/" class="btn btn-outline-secondary">← 返回首页</a>
            <a href="https://r08n4wcf67e.feishu.cn/wiki/V5VfwG44sivjjbkJkkBcHzlbnEe" target="_blank" class="btn btn-sm btn-outline-primary">
                📖 详细使用说明
            </a>
        </div>

        <div class="text-center mb-4">
            <h2>🔍 查询任务状态</h2>
            <p class="lead">输入学号和密码查询当前推送设置</p>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <form id="queryForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">学号 (Username)</label>
                        <input type="text" class="form-control" id="username" required placeholder="请输入学号">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密码 (Password)</label>
                        <input type="password" class="form-control" id="password" required placeholder="请输入教务系统密码">
                        <div class="form-text">仅用于验证身份，我们不会保存您的明文密码</div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" id="queryBtn">查询状态</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 查询结果展示区域 -->
        <div class="card shadow status-card" id="statusCard">
            <div class="card-header bg-info text-white">
                <h5 class="card-title mb-0">当前任务配置</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">上次运行时间:</div>
                    <div class="col-md-8" id="displayLastRun"></div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4 fw-bold">上次运行状态:</div>
                    <div class="col-md-8" id="displayLastStatus"></div>
                </div>
                
                <hr>

                <form id="updateForm">
                    <div class="mb-3">
                        <label for="cronExpression" class="form-label fw-bold">定时推送频率</label>
                        <select class="form-select" id="cronExpression">
                            <option value="*/1 * * * *">每 1 分钟检测一次 (测试用)</option>
                            <option value="*/30 * * * *">每 30 分钟检测一次</option>
                            <option value="0 * * * *">每 60 分钟检测一次</option>
                        </select>
                    </div>

                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="isActive">
                        <label class="form-check-label" for="isActive">启用定时推送功能 (Active)</label>
                    </div>
                    <div class="mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="forcePush">
                        <label class="form-check-label" for="forcePush">强制推送 (无论成绩是否变化都推送)</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-success" id="updateBtn">更新设置</button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="mt-5 text-center text-muted">
            <small>&copy; 2026 教务系统成绩推送助手</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('queryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('queryBtn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.textContent = '查询中...';
            
            try {
                const response = await fetch('/api/get_user_status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    const data = result.data;
                    document.getElementById('statusCard').style.display = 'block';
                    // document.getElementById('displayCron').textContent = data.cron_expression;
                    document.getElementById('displayLastRun').textContent = data.last_run_time || '暂无记录';
                    document.getElementById('displayLastStatus').textContent = data.last_run_status || '未知';
                    
                    document.getElementById('isActive').checked = !!data.is_active;
                    document.getElementById('forcePush').checked = !!data.force_push;
                    
                    // 保存当前的username/password用于更新
                    window.currentUser = { username, password };
                } else {
                    alert('查询失败: ' + result.message);
                    document.getElementById('statusCard').style.display = 'none';
                }
            } catch (error) {
                alert('系统错误: ' + error);
            } finally {
                btn.disabled = false;
                btn.textContent = '查询状态';
            }
        });

        document.getElementById('updateBtn').addEventListener('click', async function() {
            if (!window.currentUser) return;
            
            const btn = document.getElementById('updateBtn');
            const isActive = document.getElementById('isActive').checked;
            const forcePush = document.getElementById('forcePush').checked;
            const cronExpression = document.getElementById('cronExpression').value;
            
            btn.disabled = true;
            btn.textContent = '更新中...';
            
            try {
                const response = await fetch('/api/update_user_status', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: window.currentUser.username,
                        password: window.currentUser.password,
                        is_active: isActive,
                        force_push: forcePush,
                        cron_expression: cronExpression
                    })
                });
                
                const result = await response.json();
                alert(result.message);
                
            } catch (error) {
                alert('更新失败: ' + error);
            } finally {
                btn.disabled = false;
                btn.textContent = '更新设置';
            }
        });
    </script>
  </body>
</html>
